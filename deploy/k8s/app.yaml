apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftgcp
  namespace: driftgcp
  labels:
    app: driftgcp
    team: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driftgcp
  template:
    metadata:
      labels:
        app: driftgcp
        team: devops
    spec:
      serviceAccountName: driftgcp # Workload Identity -> driftgcp-qa@<gcp-project-id>.iam.gserviceaccount.com
      containers:
        - name: driftgcp
          image: <region>-docker.pkg.dev/<gcp-project-id>/driftgcp/driftgcp:vN # substitute your registry path + tag
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: driftgcp-app-secret
          # No dedicated /healthz — /login is public and always 200, so it
          # doubles as the liveness/readiness check.
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: driftgcp
  namespace: driftgcp
spec:
  selector:
    app: driftgcp
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: driftgcp
  namespace: driftgcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: driftgcp.your-domain.example # substitute your real hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: driftgcp
                port:
                  number: 8080
  tls:
    - hosts:
        - driftgcp.your-domain.example # substitute your real hostname
      secretName: driftgcp-tls
